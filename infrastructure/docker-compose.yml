services:
  mongodb:
    image: mongo:7.0
    container_name: threat_atlas_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: threat_atlas
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: threat_atlas_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
